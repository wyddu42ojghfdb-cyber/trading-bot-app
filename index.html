<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trading Bot - Admin Hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b1426; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-container { width: 100%; max-width: 400px; background-color: #2c1a30; border: 2px solid #8b5cf6; border-radius: 20px; padding: 20px; box-sizing: border-box; margin-bottom: 20px; }
        h1 { text-align: center; color: #f472b6; font-size: 22px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; background-color: #a855f7; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #6b21a8; background-color: #152238; color: white; box-sizing: border-box; }
        .request-card { background-color: #1c1917; border-radius: 12px; padding: 15px; margin-top: 15px; font-size: 13px; border: 1px solid; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-approve { background-color: #22c55e; padding: 8px; border-radius: 6px; border: none; color: white; font-weight: bold; width: 50%; cursor: pointer; }
        .btn-reject { background-color: #ef4444; padding: 8px; border-radius: 6px; border: none; color: white; font-weight: bold; width: 50%; cursor: pointer; }
        .no-reqs { text-align: center; color: #a8a29e; font-style: italic; font-size: 13px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>🔐 لوحة التحكم الرئيسية وتفعيل الأرباح</h1>
    <div class="input-group">
        <label>أدخل كلمة مرور المشرف للحماية:</label>
        <input type="password" id="adminPass" placeholder="******">
    </div>
    <button onclick="runAdminTradeCloud()">🚀 تشغيل الصفقة وتوزيع أرباح 15% حياً</button>
</div>

<div class="admin-container" style="border-color: #22c55e;">
    <h1>📥 إدارة طلبات الإيداع الواردة (شحن الحسابات)</h1>
    <div id="depositList"></div>
    <div id="noDeposits" class="no-reqs">لا توجد طلبات إيداع حقيقية معلقة حالياً.</div>
</div>

<div class="admin-container" style="border-color: #ea580c;">
    <h1>📤 إدارة طلبات السحب الواردة (صرف الأموال)</h1>
    <div id="requestsList"></div>
    <div id="noRequests" class="no-reqs">لا توجد طلبات سحب معلقة حالياً.</div>
</div>

<script>
    const CLOUD_API = "https://myjson.online";

    window.onload = function() {
        setInterval(loadCloudDataAdmin, 3000); // تحديث لوحة التحكم تلقائياً كل 3 ثوانٍ من السحاب
    }

    function loadCloudDataAdmin() {
        fetch(CLOUD_API)
        .then(res => res.json())
        .then(resData => {
            const data = resData.data;
            
            // عرض طلب الإيداع إذا قُدم سحابياً
            if(data.depositStatus === "pending" && data.pendingDepositHash !== "") {
                document.getElementById("noDeposits").style.display = "none";
                document.getElementById("depositList").innerHTML = `
                    <div class="request-card" style="border-color: #22c55e;">
                        <p>👤 اسم المشترك الطالب: <strong style="color:#00ffd0;">${data.pendingDepositUser}</strong></p>
                        <p>💵 المبلغ المطلوب إيداعه: <strong style="color: #4ade80;">\$${data.pendingDepositAmount}.00 الحقيقي</strong></p>
                        <div class="action-btns">
                            <button class="btn-approve" onclick="approveDepositCloud()">✓ موافقة وشحن الحساب</button>
                            <button class="btn-reject" onclick="rejectDepositCloud()">✕ رفض الطلب</button>
                        </div>
                    </div>`;
            } else {
                document.getElementById("noDeposits").style.display = "block";
                document.getElementById("depositList").innerHTML = "";
            }

            // عرض طلب السحب إذا قُدم سحابياً
            if(data.withdrawStatus === "pending") {
                document.getElementById("noRequests").style.display = "none";
                document.getElementById("requestsList").innerHTML = `
                    <div class="request-card" style="border-color: #ea580c;">
                        <p>👤 اسم المستخدم: <strong style="color:#00ffd0;">${data.pendingWithdrawUser}</strong></p>
                        <p>💵 المبلغ المطلوب سحبه: <strong style="color: #ef4444;">\$${data.pendingWithdrawAmount}.00</strong></p>
                        <p>💼 محفظة المستلم المستهدفة:<br><span style="color:#e2e8f0; font-size:11px; word-break:break-all;">${data.pendingWithdrawWallet}</span></p>
                        <div class="action-btns">
                            <button class="btn-approve" onclick="approveWithdrawCloud()">✓ موافقة وإرسال</button>
                            <button class="btn-reject" onclick="rejectWithdrawCloud()">✕ رفض وإلغاء</button>
                        </div>
                    </div>`;
            } else {
                document.getElementById("noRequests").style.display = "block";
                document.getElementById("requestsList").innerHTML = "";
            }
        });
    }

    function approveDepositCloud() {
        fetch(CLOUD_API).then(res => res.json()).then(resData => {
            let data = resData.data;
            data.approvedBalance = data.pendingDepositAmount;
            data.depositStatus = "approved";
            data.pendingDepositAmount = null;

            fetch(CLOUD_API, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data: data}) })
            .then(() => alert("✅ تم الموافقة وشحن الرصيد الحقيقي للمشترك بنجاح عبر السحاب!"));
        });
    }

    function rejectDepositCloud() {
        fetch(CLOUD_API).then(res => res.json()).then(resData => {
            let data = resData.data;
            data.depositStatus = "rejected";
            data.pendingDepositAmount = null;
            fetch(CLOUD_API, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data: data}) });
        });
    }

    function runAdminTradeCloud() {
        const pass = document.getElementById("adminPass").value;
        if(pass !== "123456") { alert("كلمة مرور المشرف غير صحيحة!"); return; }

        fetch(CLOUD_API).then(res => res.json()).then(resData => {
            let data = resData.data;
            const bal = parseFloat(data.approvedBalance || 0);
            if(bal === 0) { alert("⚠️ لا يمكن تشغيل الصفقة لعدم وجود مودعين نشطين!"); return; }

            data.approvedBalance = bal + (bal * 0.15); // زيادة الـ 15% حقيقية سحابياً للمودع فقط
            data.tradeExecuted = true;

            fetch(CLOUD_API, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data: data}) })
            .then(() => alert("🚀 نجاح! زر الصفقة اشتغل وتم توزيع أرباح الـ 15% حلياً للمودعين فقط عبر السحاب."));
        });
    }

    function approveWithdrawCloud() {
        fetch(CLOUD_API).then(res => res.json()).then(resData => {
            let data = resData.data;
            const bal = parseFloat(data.approvedBalance || 0);
            const wit = parseFloat(data.pendingWithdrawAmount || 0);
            data.approvedBalance = bal - wit;
            data.withdrawStatus = "approved";
            data.pendingWithdrawAmount = null;

            fetch(CLOUD_API, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data: data}) })
            .then(() => alert("✓ تم تفعيل السحب بنجاح وخصمه سحابياً."));
        });
    }

    function rejectWithdrawCloud() {
        fetch(CLOUD_API).then(res => res.json()).then(resData => {
            let data = resData.data;
            data.withdrawStatus = "rejected";
            data.pendingWithdrawAmount = null;
            fetch(CLOUD_API, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data: data}) });
        });
    }
</script>
</body>
</html>
