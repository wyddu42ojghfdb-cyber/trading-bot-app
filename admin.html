<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trading Bot - Admin Hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b1426; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-container { width: 100%; max-width: 400px; background-color: #2c1a30; border: 2px solid #8b5cf6; border-radius: 20px; padding: 20px; box-sizing: border-box; margin-bottom: 20px; }
        h1 { text-align: center; color: #f472b6; font-size: 22px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; background-color: #a855f7; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #6b21a8; background-color: #152238; color: white; box-sizing: border-box; }
        .request-card { background-color: #1c1917; border-radius: 12px; padding: 15px; margin-top: 15px; font-size: 13px; border: 1px solid; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-approve { background-color: #22c55e; padding: 8px; border-radius: 6px; border: none; color: white; font-weight: bold; width: 50%; cursor: pointer; }
        .btn-reject { background-color: #ef4444; padding: 8px; border-radius: 6px; border: none; color: white; font-weight: bold; width: 50%; cursor: pointer; }
        .no-reqs { text-align: center; color: #a8a29e; font-style: italic; font-size: 13px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>🔐 لوحة التحكم الرئيسية وتفعيل الأرباح</h1>
    <div class="input-group">
        <label>أدخل كلمة مرور المشرف للحماية:</label>
        <input type="password" id="adminPass" placeholder="******">
    </div>
    <button onclick="runAdminTradeRender()">🚀 تشغيل الصفقة وتوزيع أرباح 15% حياً</button>
</div>

<div class="admin-container" style="border-color: #22c55e;">
    <h1>📥 إدارة طلبات الإيداع الواردة (شحن الحسابات)</h1>
    <div id="depositList"></div>
    <div id="noDeposits" class="no-reqs">لا توجد طلبات إيداع حقيقية معلقة حالياً.</div>
</div>

<div class="admin-container" style="border-color: #ea580c;">
    <h1>📤 إدارة طلبات السحب الواردة (صرف الأموال)</h1>
    <div id="requestsList"></div>
    <div id="noRequests" class="no-reqs">لا توجد طلبات سحب معلقة حالياً.</div>
</div>

<script>
    const RENDER_SERVER = "https://onrender.com";

    window.onload = function() {
        // الاتصال بالسيرفر وجلب طلبات المستخدمين حياً كل 3 ثوانٍ وتحديث الشاشة
        setInterval(fetchAdminDataFromRender, 3000);
    }

    function fetchAdminDataFromRender() {
        fetch(`${RENDER_SERVER}/admin/get-requests`)
        .then(res => res.json())
        .then(data => {
            // عرض طلب الإيداع القادم من السيرفر حياً
            if(data && data.pending_deposit_user) {
                document.getElementById("noDeposits").style.display = "none";
                document.getElementById("depositList").innerHTML = `
                    <div class="request-card" style="border-color: #22c55e;">
                        <p>👤 اسم المشترك الطالب: <strong style="color:#00ffd0;">${data.pending_deposit_user}</strong></p>
                        <p>💵 المبلغ المطلوب إيداعه: <strong style="color: #4ade80;">\$${data.pending_deposit_amount}.00 الحقيقي</strong></p>
                        <div class="action-btns">
                            <button class="btn-approve" onclick="approveDepositRender('${data.pending_deposit_user}')">✓ موافقة وشحن الحساب</button>
                            <button class="btn-reject" onclick="rejectDepositRender('${data.pending_deposit_user}')">✕ رفض الطلب</button>
                        </div>
                    </div>`;
            } else {
                document.getElementById("noDeposits").style.display = "block";
                document.getElementById("depositList").innerHTML = "";
            }

            // عرض طلب السحب القادم من السيرفر حياً
            if(data && data.pending_withdraw_user) {
                document.getElementById("noRequests").style.display = "none";
                document.getElementById("requestsList").innerHTML = `
                    <div class="request-card" style="border-color: #ea580c;">
                        <p>👤 اسم المستخدم: <strong style="color:#00ffd0;">${data.pending_withdraw_user}</strong></p>
                        <p>💵 المبلغ المطلوب سحبه: <strong style="color: #ef4444;">\$${data.pending_withdraw_amount}.00</strong></p>
                        <p>💼 محفظة المستلم المستهدفة:<br><span style="color:#e2e8f0; font-size:11px; word-break:break-all;">${data.pending_withdraw_wallet}</span></p>
                        <div class="action-btns">
                            <button class="btn-approve" onclick="approveWithdrawRender('${data.pending_withdraw_user}')">✓ موافقة وإرسال</button>
                            <button class="btn-reject" onclick="rejectWithdrawRender('${data.pending_withdraw_user}')">✕ رفض وإلغاء</button>
                        </div>
                    </div>`;
            } else {
                document.getElementById("noRequests").style.display = "block";
                document.getElementById("requestsList").innerHTML = "";
            }
        });
    }

    function approveDepositRender(user) {
        fetch(`${RENDER_SERVER}/admin/approve-deposit`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: user })
        }).then(() => alert("✅ تم الموافقة وشحن حساب المشترك بالرصيد الحقيقي سحابياً عبر سيرفر Render!"));
    }

    function rejectDepositRender(user) {
        fetch(`${RENDER_SERVER}/admin/reject-deposit`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: user })
        });
    }

    function runAdminTradeRender() {
        const pass = document.getElementById("adminPass").value;
        if(pass !== "123456") { alert("كلمة مرور المشرف غير صحيحة!"); return; }

        // إصدار أمر الصفقة للسيرفر لتوزيع الـ 15% على المودعين الحقيقيين
        fetch(`${RENDER_SERVER}/admin/run-trade-button`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            alert(`🔥 نجاح تشغيل الصفقة الحية وسيرفر Render قام بتوزيع أرباح الـ 15% للمودعين فقط بنجاح!`);
        });
    }

    function approveWithdrawRender(user) {
        fetch(`${RENDER_SERVER}/admin/approve-withdraw`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: user })
        }).then(() => alert("✓ تم تفعيل السحب بنجاح وخصمه من رصيد السيرفر حياً."));
    }

    function rejectWithdrawRender(user) {
        fetch(`${RENDER_SERVER}/admin/reject-withdraw`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: user })
        });
    }
</script>
</body>
</html>
