<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trading Bot - Admin Hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b1426; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-container { width: 100%; max-width: 400px; background-color: #2c1a30; border: 2px solid #8b5cf6; border-radius: 20px; padding: 20px; box-sizing: border-box; margin-bottom: 20px; }
        h1 { text-align: center; color: #f472b6; font-size: 22px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; background-color: #a855f7; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #6b21a8; background-color: #152238; color: white; box-sizing: border-box; }
        .request-card { background-color: #1c1917; border-radius: 12px; padding: 15px; margin-top: 15px; font-size: 13px; border: 1px solid; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-approve { background-color: #22c55e; padding: 8px; border-radius: 6px; border: none; color: white; font-weight: bold; width: 50%; cursor: pointer; }
        .btn-reject { background-color: #ef4444; padding: 8px; border-radius: 6px; border: none; color: white; font-weight: bold; width: 50%; cursor: pointer; }
        .no-reqs { text-align: center; color: #a8a29e; font-style: italic; font-size: 13px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>🔐 لوحة التحكم الرئيسية وتفعيل الأرباح</h1>
    <div class="input-group">
        <label>أدخل كلمة مرور المشرف للحماية:</label>
        <input type="password" id="adminPass" placeholder="******">
    </div>
    <button onclick="runAdminTrade()">🚀 تشغيل الصفقة وتوزيع أرباح 15% حياً</button>
</div>

<!-- إدارة طلبات الإيداع السهلة بدون رقم معاملة -->
<div class="admin-container" style="border-color: #22c55e;">
    <h1>📥 إدارة طلبات الإيداع الواردة (شحن الحسابات)</h1>
    <div id="depositList"></div>
    <div id="noDeposits" class="no-reqs">لا توجد طلبات إيداع حقيقية معلقة حالياً.</div>
</div>

<!-- إدارة طلبات السحب وصرف الأموال حياً -->
<div class="admin-container" style="border-color: #ea580c;">
    <h1>📤 إدارة طلبات السحب الواردة (صرف الأموال)</h1>
    <div id="requestsList"></div>
    <div id="noRequests" class="no-reqs">لا توجد طلبات سحب معلقة حالياً.</div>
</div>

<script>
    window.onload = function() {
        loadPendingDeposits();
        loadPendingRequests();
    }

    function loadPendingDeposits() {
        const u = localStorage.getItem("pending_deposit_user");
        const a = localStorage.getItem("pending_deposit_amount");
        const isApproved = localStorage.getItem("deposit_status_approved");
        const trigger = localStorage.getItem("pending_deposit_trigger");

        if (isApproved !== "true" && trigger === "true" && u && a) {
            document.getElementById("noDeposits").style.display = "none";
            document.getElementById("depositList").innerHTML = `
                <div class="request-card" style="border-color: #22c55e;" id="depCard">
                    <p>👤 اسم المشترك الطالب: <strong style="color:#00ffd0;">${u}</strong></p>
                    <p>💵 المبلغ المطلوب إيداعه: <strong style="color: #4ade80;">\$${a}.00 الحقيقي</strong></p>
                    <p style="color: #cbd5e1; font-style: italic; font-size:11px;">ℹ️ يرجى مراجعة محفظتك لتأكيد استلام المبلغ قبل الضغط على موافقة.</p>
                    <div class="action-btns">
                        <button class="btn-approve" onclick="approveDeposit()">✓ موافقة وشحن الحساب</button>
                        <button class="btn-reject" onclick="rejectDeposit()">✕ رفض الطلب</button>
                    </div>
                </div>
            `;
        } else {
            document.getElementById("noDeposits").style.display = "block";
            if(document.getElementById("depositList")) document.getElementById("depositList").innerHTML = "";
        }
    }

    function approveDeposit() {
        const amountToInject = parseFloat(localStorage.getItem("pending_deposit_amount") || 0);
        localStorage.setItem("real_user_balance", amountToInject);
        localStorage.setItem("deposit_status_approved", "true");
        localStorage.removeItem("pending_deposit_trigger");
        
        loadPendingDeposits();
        alert(`✅ تم اعتماد التفعيل! تم شحن رصيد المشترك بمبلغ \$${amountToInject} حقيقية ونشطة.`);
    }

    function rejectDeposit() {
        localStorage.removeItem("pending_deposit_trigger");
        localStorage.removeItem("pending_deposit_user");
        localStorage.removeItem("pending_deposit_amount");
        loadPendingDeposits();
        alert("✕ تم رفض وإلغاء طلب الإيداع.");
    }

    function loadPendingRequests() {
        const u = localStorage.getItem("pending_withdraw_user") || "Abala";
        const a = localStorage.getItem("pending_withdraw_amount");
        const w = localStorage.getItem("pending_withdraw_wallet");
        const isApproved = localStorage.getItem("withdraw_status_approved");
        
        if(isApproved !== "true" && w && u && a) {
            document.getElementById("noRequests").style.display = "none";
            document.getElementById("requestsList").innerHTML = `
                <div class="request-card" style="border-color: #ea580c;" id="cardActual">
                    <p>👤 اسم المستخدم: <strong style="color:#00ffd0;">${u}</strong></p>
                    <p>💵 المبلغ المطلوب سحبه: <strong style="color: #ef4444;">\$${a}.00</strong></p>
                    <p>💼 محفظة المستلم المستهدفة:<br><span style="color:#e2e8f0; font-size:11px; word-break:break-all;">${w}</span></p>
                    <div class="action-btns">
                        <button class="btn-approve" onclick="approveWithdraw()">✓ موافقة وإرسال</button>
                        <button class="btn-reject" onclick="rejectWithdraw()">✕ رفض وإلغاء</button>
                    </div>
                </div>
            `;
        } else {
            document.getElementById("noRequests").style.display = "block";
            if(document.getElementById("requestsList")) document.getElementById("requestsList").innerHTML = "";
        }
    }

    // زر الصفقة الذكي: يوزع أرباح الـ 15% فقط وحصرياً على الأشخاص المودعين (أصحاب الرصيد الأكبر من صفر)
    function runAdminTrade() {
        const pass = document.getElementById("adminPass").value;
        if(pass !== "123456") { alert("كلمة مرور المشرف غير صحيحة!"); return; }
        
        const currentBalance = parseFloat(localStorage.getItem("real_user_balance") || 0);
        if (currentBalance === 0) { 
            alert("⚠️ لا يمكن توزيع الأرباح! زر الصفقة يعمل فقط مع المستخدمين الذين قاموا بالإيداع الفعلي وتم تفعيل رصيدهم بنجاح."); 
            return; 
        }
        
        const profitAmount = currentBalance * 0.15;
        const newBalance = currentBalance + profitAmount;
        localStorage.setItem("real_user_balance", newBalance);
        localStorage.setItem("local_trade_executed", "true");
        
        alert(`🔥 تم بنجاح! زر الصفقة تفاعل مع الرصيد النشط وقام بتوزيع أرباح بنسبة 15% (+\$${profitAmount.toFixed(2)}) على المودعين فقط!`);
    }

    function approveWithdraw() {
        const today = new Date();
        const formattedDate = today.toISOString().split('T')[0]; // تاريخ اليوم الحقيقي المعتمد حياً
        const currentBalance = parseFloat(localStorage.getItem("real_user_balance") || 0);
        const withdrawAmount = parseFloat(localStorage.getItem("pending_withdraw_amount") || 0);
        
        if(currentBalance >= withdrawAmount) { localStorage.setItem("real_user_balance", currentBalance - withdrawAmount); }
        localStorage.setItem("withdraw_status_approved", "true");
        localStorage.setItem("withdraw_success_date", formattedDate);
        loadPendingRequests();
        alert(`✓ تمت موافقة سحب الأموال بنجاح وتأريخها بتاريخ اليوم: ${formattedDate}`);
    }

    function rejectWithdraw() {
        localStorage.removeItem("pending_withdraw_wallet");
        localStorage.removeItem("pending_withdraw_user");
        localStorage.removeItem("pending_withdraw_amount");
        loadPendingRequests();
        alert("✕ تم رفض طلب السحب.");
    }
</script>
</body>
</html>
